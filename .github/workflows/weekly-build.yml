name: "Weekly Build"

on:
  schedule:
    - cron: '0 0 * * 0' # Runs every Sunday at midnight
  workflow_dispatch: # Allows you to run it manually from the Actions tab

jobs:
  build-wails:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "ubuntu-24.04" # Linux build
            os_name: "linux"
          - platform: "windows-latest" # Windows build
            os_name: "windows"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23' # or your preferred Go version

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Linux dependencies
        if: matrix.os_name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Wails app (Linux)
        if: matrix.os_name == 'linux'
        run: wails build -tags webkit2_41

      - name: Build Wails app (Windows Standalone .exe)
        if: matrix.os_name == 'windows'
        run: wails build

      - name: Build Wails app (Windows Installer)
        if: matrix.os_name == 'windows'
        run: |
          choco install nsis
          wails build -nsis

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: weekly-${{ github.run_number }}
          name: "RPCraft Weekly Build #${{ github.run_number }}"
          body: "Automated weekly build for Wails."
          draft: true
          prerelease: false
          files: |
            build/bin/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
