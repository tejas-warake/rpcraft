name: "Weekly Build"

on:
  schedule:
    - cron: '0 0 * * 0' # Runs every Sunday at midnight
  workflow_dispatch: # Allows you to run it manually from the Actions tab

# Required permissions for creating draft releases
permissions:
  contents: write

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "ubuntu-22.04" # Linux build
            args: ""
          - platform: "windows-latest" # Windows build
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm' # Speeds up frontend dependency resolution

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # Speeds up Rust compilation time tremendously for weekly runs
      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # Updated dependencies specifically required by Tauri v2 on Ubuntu
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libjavascriptcoregtk-4.1-dev soup-backend

      - name: Install frontend dependencies
        run: npm install

      # Upgraded to v2 to natively support Tauri 2.x structures
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: weekly-build-v__VERSION__ 
          releaseName: "RPCraft v__VERSION__ (Weekly Build)"
          releaseBody: "Automated weekly snapshot build."
          releaseDraft: true
          prerelease: true # Best practice to mark automated weekly snapshots as prerelease
          args: ${{ matrix.args }}
